<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <style>
    .col, .row { font-size: 18px; font-weight: 700; fill: #111; }
    .label    { font-size: 14px; font-weight: 700; fill: #111; }
    .body     { font-size: 14px; fill: #1a1a1a; }
    rect.quad { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.8; }
  </style>

  <rect width="740" height="520" fill="#ffffff"/>

  <!-- Column headers -->
  <text x="280" y="36" class="col" text-anchor="middle">Blocking</text>
  <text x="570" y="36" class="col" text-anchor="middle">Non-Blocking</text>

  <!-- Row labels (rotated) -->
  <text x="32" y="170" class="row" text-anchor="middle" transform="rotate(-90 32 170)">Synchronous</text>
  <text x="32" y="380" class="row" text-anchor="middle" transform="rotate(-90 32 380)">Asynchronous</text>

  <!-- ① Sync-Blocking -->
  <rect class="quad" x="140" y="60" width="280" height="200"/>
  <text x="280" y="98"  class="label" text-anchor="middle">① Sync-Blocking</text>
  <text x="280" y="135" class="body"  text-anchor="middle">call</text>
  <text x="280" y="170" class="body"  text-anchor="middle">blocked,</text>
  <text x="280" y="190" class="body"  text-anchor="middle">cannot do other work</text>
  <text x="280" y="232" class="body"  text-anchor="middle">return</text>

  <!-- ② Sync-NonBlocking -->
  <rect class="quad" x="430" y="60" width="280" height="200"/>
  <text x="570" y="98"  class="label" text-anchor="middle">② Sync-NonBlocking</text>
  <text x="570" y="132" class="body"  text-anchor="middle">call</text>
  <text x="570" y="156" class="body"  text-anchor="middle">returns immediately</text>
  <text x="570" y="180" class="body"  text-anchor="middle">free, do other work</text>
  <text x="570" y="208" class="body"  text-anchor="middle">poll</text>
  <text x="570" y="240" class="body"  text-anchor="middle">result</text>

  <!-- ③ Async-Blocking -->
  <rect class="quad" x="140" y="280" width="280" height="200"/>
  <text x="280" y="318" class="label" text-anchor="middle">③ Async-Blocking</text>
  <text x="280" y="355" class="body"  text-anchor="middle">call with callback</text>
  <text x="280" y="390" class="body"  text-anchor="middle">blocked,</text>
  <text x="280" y="410" class="body"  text-anchor="middle">cannot do other work</text>
  <text x="280" y="452" class="body"  text-anchor="middle">callback fires</text>

  <!-- ④ Async-NonBlocking -->
  <rect class="quad" x="430" y="280" width="280" height="200"/>
  <text x="570" y="318" class="label" text-anchor="middle">④ Async-NonBlocking</text>
  <text x="570" y="352" class="body"  text-anchor="middle">call with callback</text>
  <text x="570" y="376" class="body"  text-anchor="middle">returns immediately</text>
  <text x="570" y="400" class="body"  text-anchor="middle">free, do other work</text>
  <text x="570" y="452" class="body"  text-anchor="middle">callback fires</text>
</svg>
